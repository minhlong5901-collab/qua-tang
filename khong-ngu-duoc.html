<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nếu hôm nay em không ngủ được 🌙</title>
<style>
:root{box-sizing:border-box;--ink:#e9e6ff;--sub:#a9a4d6;--accent:#b7a6ff;--accent2:#7f8cff;--track:#2c2a56}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 0%,#2b2866 0%,#14122e 55%,#0b0a1d 100%);color:var(--ink);font-family:"Be Vietnam Pro","Segoe UI",system-ui,sans-serif;line-height:1.6;overflow-x:hidden;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.stars{position:fixed;inset:0;pointer-events:none}
.stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.2;animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
main{position:relative;max-width:460px;margin:0 auto;min-height:100%;padding:36px 22px 40px;display:flex;flex-direction:column;align-items:center;text-align:center}
.moon{font-size:64px;filter:drop-shadow(0 0 18px rgba(183,166,255,.6));animation:float 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
h1{font-size:25px;margin:14px 0 8px;font-weight:600;letter-spacing:.2px}
.lead{color:var(--sub);font-size:15px;margin:0 0 26px}
.card{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:26px 20px;backdrop-filter:blur(6px)}
.play{width:92px;height:92px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#14122e;font-size:32px;cursor:pointer;box-shadow:0 0 0 0 rgba(183,166,255,.5);display:grid;place-items:center;margin:0 auto}
.play.on{animation:pulse 2.6s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(183,166,255,.45)}100%{box-shadow:0 0 0 26px rgba(183,166,255,0)}}
.play:disabled{opacity:.35;cursor:not-allowed;animation:none}
.title{margin:16px 0 2px;font-weight:600;font-size:17px}
.hint{color:var(--sub);font-size:13px;min-height:20px}
.bar{height:6px;background:var(--track);border-radius:3px;margin-top:18px;cursor:pointer;overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent2),var(--accent))}
.time{display:flex;justify-content:space-between;color:var(--sub);font-size:12px;margin-top:5px}
.opts{margin-top:16px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.chip{background:transparent;border:1px solid rgba(255,255,255,.2);color:var(--sub);border-radius:20px;padding:7px 14px;font-size:13px;cursor:pointer;font-family:inherit}
.chip.on{background:rgba(183,166,255,.2);color:var(--ink);border-color:var(--accent)}
.note{margin:28px 6px 0;color:var(--sub);font-size:14px}
.note b{color:var(--ink);font-weight:500}
footer{margin-top:auto;padding-top:30px;color:var(--sub);font-size:14px}
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<main>
  <div class="moon">🌙</div>
  <h1>Nếu hôm nay em không ngủ được</h1>
  <p class="lead">Không sao đâu. Tắt bớt đèn, nằm xuống và để anh ở bên em một lúc nhé.</p>

  <section class="card">
    <button class="play" id="play" aria-label="Phát">▶</button>
    <div class="title" id="ttl">Lời nhắn đêm khuya</div>
    <div class="hint" id="hint">Bấm vào nút để nghe</div>
    <div class="bar" id="bar"><div class="fill" id="fill"></div></div>
    <div class="time"><span id="cur">0:00</span><span id="dur">0:00</span></div>
    <div class="opts">
      <button class="chip" id="loop">🔁 Lặp lại</button>
      <button class="chip" id="timer">⏳ Hẹn giờ tắt: Không</button>
    </div>
  </section>

  <p class="note">Hít vào thật chậm, thở ra thật nhẹ.<br><b>Em đã cố gắng nhiều rồi, giờ cho phép mình nghỉ ngơi nhé.</b></p>
  <footer>Chúc em ngủ ngon 💜</footer>
</main>

<script>
// ===== CHỈNH SỬA Ở ĐÂY =====
var SRC = "audio/khong-ngu-duoc.mp3"; // file mp3 đặt trong thư mục audio/
// ============================

var $ = function(id){ return document.getElementById(id); };
var st = $("stars");
for(var i=0;i<40;i++){ var s=document.createElement("i"); s.style.left=Math.random()*100+"%"; s.style.top=Math.random()*100+"%"; s.style.animationDelay=(Math.random()*4)+"s"; s.style.transform="scale("+(0.6+Math.random()*1.2)+")"; st.appendChild(s); }

function fmt(x){ if(!isFinite(x)) return "0:00"; var m=Math.floor(x/60), r=Math.floor(x%60); return m+":"+(r<10?"0":"")+r; }

var a = new Audio(SRC), play=$("play"), timerId=null, minsIdx=0, MINS=[0,15,30,60];
a.preload = "metadata";
a.addEventListener("error", function(){ play.disabled = true; $("hint").textContent = "Chưa có file ghi âm ✨"; });
a.addEventListener("loadedmetadata", function(){ $("dur").textContent = fmt(a.duration); });
a.addEventListener("timeupdate", function(){ $("fill").style.width = (a.duration ? a.currentTime/a.duration*100 : 0) + "%"; $("cur").textContent = fmt(a.currentTime); });
a.addEventListener("ended", function(){ play.textContent="▶"; play.classList.remove("on"); $("hint").textContent="Ngủ ngon nhé 💜"; });

play.addEventListener("click", function(){
  if(a.paused){ a.play(); play.textContent="❚❚"; play.classList.add("on"); $("hint").textContent="Đang phát…"; }
  else { a.pause(); play.textContent="▶"; play.classList.remove("on"); $("hint").textContent="Đã tạm dừng"; }
});
$("bar").addEventListener("click", function(e){ var r=this.getBoundingClientRect(); if(a.duration) a.currentTime=(e.clientX-r.left)/r.width*a.duration; });
$("loop").addEventListener("click", function(){ a.loop=!a.loop; this.classList.toggle("on", a.loop); });
$("timer").addEventListener("click", function(){
  minsIdx=(minsIdx+1)%MINS.length; clearTimeout(timerId);
  var m=MINS[minsIdx];
  this.textContent = "⏳ Hẹn giờ tắt: " + (m ? m+" phút" : "Không");
  this.classList.toggle("on", !!m);
  if(m){ timerId=setTimeout(function(){ a.pause(); play.textContent="▶"; play.classList.remove("on"); $("hint").textContent="Đã tự tắt. Ngủ ngon nhé 💜"; }, m*60000); }
});
</script>
</body>
</html>
