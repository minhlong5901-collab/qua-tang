<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nếu hôm nay em không biết đọc trang nào 📖</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f3ff;--card:#ffffff;--ink:#3d3558;--sub:#8a82a8;--accent:#8b7ae6;--soft:#e9e4ff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1a2b;--card:#2a2740;--ink:#ece9ff;--sub:#b3acd6;--accent:#a595f2;--soft:#3a3659}}
:root[data-theme="dark"]{--bg:#1c1a2b;--card:#2a2740;--ink:#ece9ff;--sub:#b3acd6;--accent:#a595f2;--soft:#3a3659}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro","Segoe UI",system-ui,sans-serif;line-height:1.6}
main{max-width:460px;margin:0 auto;padding:36px 20px 44px;text-align:center}
.icon{font-size:52px;display:inline-block;animation:float 5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
h1{font-size:24px;margin:12px 0 8px;font-weight:700}
.lead{color:var(--sub);font-size:15px;margin:0 0 22px}
.frame{background:var(--card);border-radius:22px;padding:10px;box-shadow:0 6px 22px rgba(139,122,230,.18)}
video{display:block;width:100%;max-height:70vh;border-radius:14px;background:#000}
.missing{display:none;padding:56px 16px;color:var(--sub);font-size:14px}
.missing span{display:block;font-size:44px;margin-bottom:8px}
.note{margin:24px 6px 12px;color:var(--sub);font-size:14px}
.links{display:flex;flex-direction:column;gap:10px}
.links a{display:block;background:var(--card);color:var(--ink);text-decoration:none;border:1px solid var(--soft);border-radius:16px;padding:12px 14px;font-size:15px}
.links a:active{background:var(--soft)}
footer{margin-top:26px;color:var(--sub);font-size:14px}
</style>
</head>
<body>
<main>
  <div class="icon">📖</div>
  <h1>Nếu hôm nay em không biết đọc trang nào</h1>
  <p class="lead">Không sao đâu, để anh chỉ cho em nhé.</p>

  <section class="frame">
    <video id="vid" controls playsinline preload="metadata" src="video/khong-biet-doc-trang-nao.mp4"></video>
    <div class="missing" id="missing"><span>🎬</span>Chưa có video</div>
  </section>

  <p class="note">Xem xong, em chọn một trang cho đúng với hôm nay nhé:</p>
  <nav class="links">
    <a href="index.html">💗 Nếu hôm nay em muốn nghe anh nói</a>
    <a href="khong-ngu-duoc.html">🌙 Nếu hôm nay em không ngủ được</a>
    <a href="suc-khoe-khong-tot.html">🤍 Nếu hôm nay sức khỏe em không tốt</a>
  </nav>
  <footer>Thương em nhiều 🌷</footer>
</main>

<script>
// ===== CHỈNH SỬA Ở ĐÂY =====
// Video mp4 đặt trong thư mục video/ với tên khong-biet-doc-trang-nao.mp4 (đổi ở thẻ <video> phía trên)
// ============================
var v = document.getElementById("vid");
v.addEventListener("error", function(){
  v.style.display = "none";
  document.getElementById("missing").style.display = "block";
});
</script>
</body>
</html>
