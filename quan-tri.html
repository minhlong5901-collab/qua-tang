<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Quản trị các trang quà tặng</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f5f9;--card:#fff;--ink:#2b2f45;--sub:#7b8099;--accent:#5b6cf0;--soft:#e8ebfb;--ok:#22a06b;--warn:#d9822b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171923;--card:#232636;--ink:#e9ebf7;--sub:#9da3c0;--accent:#7f8cff;--soft:#32364f;--ok:#4cc38a;--warn:#f0a25a}}
:root[data-theme="dark"]{--bg:#171923;--card:#232636;--ink:#e9ebf7;--sub:#9da3c0;--accent:#7f8cff;--soft:#32364f;--ok:#4cc38a;--warn:#f0a25a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro","Segoe UI",system-ui,sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:28px 16px 48px}
h1{font-size:22px;margin:0 0 4px}
.lead{color:var(--sub);font-size:14px;margin:0 0 20px}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(40,50,100,.08)}
.top{display:flex;gap:12px;align-items:flex-start}
.em{font-size:30px;line-height:1}
.name{font-weight:600;font-size:16px}
.file{font-size:12px;color:var(--sub);word-break:break-all}
.link{display:block;margin-top:10px;padding:9px 11px;background:var(--bg);border-radius:10px;color:var(--accent);font-size:13px;word-break:break-all;text-decoration:none}
.badge{display:inline-block;margin-top:8px;font-size:12px;padding:2px 9px;border-radius:20px;background:var(--soft)}
.ok{color:var(--ok)}.warn{color:var(--warn)}
.acts{display:flex;gap:8px;margin-top:12px}
.acts a,.acts button{flex:1;text-align:center;text-decoration:none;border:0;border-radius:12px;padding:10px 6px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;background:var(--soft);color:var(--ink)}
.acts .open{background:var(--accent);color:#fff}
.foot{color:var(--sub);font-size:12px;text-align:center;margin-top:22px}
</style>
</head>
<body>
<main>
  <h1>🛠️ Quản trị các trang quà tặng</h1>
  <p class="lead">Bấm vào từng trang để mở hoặc sao chép link ghi vào thẻ NFC.</p>
  <div id="list"></div>
  <p class="foot">Trang này chỉ để bạn dùng, đừng ghi link này vào thẻ NFC.<br>Thêm trang mới: sửa danh sách PAGES ở cuối file.</p>
</main>

<script>
// ===== CHỈNH SỬA Ở ĐÂY: mỗi trang là một dòng =====
// file: tên file html | media: file đi kèm cần upload (để "" nếu không có)
var PAGES = [
  {emoji:"💗", title:"Nếu hôm nay em muốn nghe anh nói",           file:"index.html",                    media:"audio/nghe-anh-noi.mp3",   mediaLabel:"file ghi âm"},
  {emoji:"🌙", title:"Nếu hôm nay em không ngủ được",              file:"khong-ngu-duoc.html",           media:"audio/khong-ngu-duoc.mp3", mediaLabel:"file ghi âm"},
  {emoji:"🤍", title:"Nếu hôm nay sức khỏe em không tốt",          file:"suc-khoe-khong-tot.html",       media:"img/hun.gif",              mediaLabel:"ảnh GIF"},
  {emoji:"📖", title:"Nếu hôm nay em không biết đọc trang nào",    file:"khong-biet-doc-trang-nao.html", media:"video/khong-biet-doc-trang-nao.mp4", mediaLabel:"video"},
  {emoji:"💌", title:"Nếu hôm nay em có điều nhắn nhủ với anh",    file:"nhan-nhu-anh.html",             media:"",                         mediaLabel:""}
];
// ==================================================

var list = document.getElementById("list");
function full(f){ return new URL(f === "index.html" ? "./" : f, location.href).href; }

PAGES.forEach(function(p){
  var url = full(p.file);
  var el = document.createElement("div"); el.className = "card";

  var top = document.createElement("div"); top.className = "top";
  var em = document.createElement("div"); em.className = "em"; em.textContent = p.emoji;
  var info = document.createElement("div");
  var n = document.createElement("div"); n.className = "name"; n.textContent = p.title;
  var f = document.createElement("div"); f.className = "file"; f.textContent = p.file;
  info.appendChild(n); info.appendChild(f); top.appendChild(em); top.appendChild(info); el.appendChild(top);

  var a = document.createElement("a"); a.className = "link"; a.href = url; a.target = "_blank"; a.rel = "noopener"; a.textContent = url;
  el.appendChild(a);

  var badge = null;
  if(p.media){
    badge = document.createElement("span"); badge.className = "badge"; badge.textContent = "Đang kiểm tra " + p.mediaLabel + "...";
    el.appendChild(badge);
    fetch(p.media, {method:"HEAD", cache:"no-store"}).then(function(r){
      if(r.ok){ badge.textContent = "✅ Đã có " + p.mediaLabel; badge.className = "badge ok"; }
      else { badge.textContent = "⚠️ Chưa có " + p.mediaLabel + " (" + p.media + ")"; badge.className = "badge warn"; }
    }).catch(function(){ badge.textContent = "⚠️ Không kiểm tra được " + p.mediaLabel; badge.className = "badge warn"; });
  }

  var acts = document.createElement("div"); acts.className = "acts";
  var open = document.createElement("a"); open.className = "open"; open.href = url; open.target = "_blank"; open.rel = "noopener"; open.textContent = "Mở trang";
  var copy = document.createElement("button"); copy.textContent = "Sao chép link";
  copy.onclick = function(){
    var done = function(){ copy.textContent = "✓ Đã sao chép"; setTimeout(function(){ copy.textContent = "Sao chép link"; }, 1800); };
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(done, function(){ prompt("Sao chép link:", url); }); }
    else { prompt("Sao chép link:", url); }
  };
  acts.appendChild(open); acts.appendChild(copy); el.appendChild(acts);
  list.appendChild(el);
});
</script>
</body>
</html>
