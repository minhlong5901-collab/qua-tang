<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nếu hôm nay em muốn nghe anh nói 💗</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fff5f3;--card:#ffffff;--ink:#4a2f3a;--sub:#9a7580;--accent:#e8708a;--accent2:#f6b7a5;--track:#f3dde0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241a1e;--card:#33252b;--ink:#fbe9ec;--sub:#c4a0aa;--accent:#f08aa2;--accent2:#8c4b5b;--track:#4a363e}}
:root[data-theme="dark"]{--bg:#241a1e;--card:#33252b;--ink:#fbe9ec;--sub:#c4a0aa;--accent:#f08aa2;--accent2:#8c4b5b;--track:#4a363e}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro","Segoe UI",system-ui,sans-serif;line-height:1.6}
main{max-width:460px;margin:0 auto;padding:36px 22px 44px;text-align:center}
.heart{font-size:56px;display:inline-block;animation:beat 1.8s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
h1{font-size:25px;margin:12px 0 8px;font-weight:700}
.lead{color:var(--sub);font-size:15px;margin:0 0 26px}
.card{background:var(--card);border-radius:24px;padding:26px 20px;box-shadow:0 6px 22px rgba(232,112,138,.15)}
.play{width:92px;height:92px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:32px;cursor:pointer;display:grid;place-items:center;margin:0 auto}
.play:active{transform:scale(.95)}
.play:disabled{opacity:.4;cursor:not-allowed}
.play.on{animation:pulse 2.6s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(232,112,138,.4)}100%{box-shadow:0 0 0 26px rgba(232,112,138,0)}}
.title{margin:16px 0 2px;font-weight:600;font-size:17px}
.hint{color:var(--sub);font-size:13px;min-height:20px}
.bar{height:6px;background:var(--track);border-radius:3px;margin-top:18px;cursor:pointer;overflow:hidden}
.fill{height:100%;width:0;background:var(--accent)}
.time{display:flex;justify-content:space-between;color:var(--sub);font-size:12px;margin-top:5px}
.note{margin:26px 6px 0;color:var(--sub);font-size:14px}
footer{margin-top:28px;color:var(--sub);font-size:14px}
</style>
</head>
<body>
<main>
  <div class="heart">💗</div>
  <h1>Nếu hôm nay em muốn nghe anh nói</h1>
  <p class="lead">Tìm một chỗ yên tĩnh, ngồi xuống thoải mái và nghe anh nói nhé.</p>

  <section class="card">
    <button class="play" id="play" aria-label="Phát">▶</button>
    <div class="title">Lời anh muốn nói với em</div>
    <div class="hint" id="hint">Bấm vào nút để nghe</div>
    <div class="bar" id="bar"><div class="fill" id="fill"></div></div>
    <div class="time"><span id="cur">0:00</span><span id="dur">0:00</span></div>
  </section>

  <p class="note">Dù em đang vui hay mệt, anh vẫn luôn ở đây.</p>
  <footer>Yêu em nhiều lắm 🌷</footer>
</main>

<script>
// ===== CHỈNH SỬA Ở ĐÂY =====
var SRC = "audio/nghe-anh-noi.mp3"; // file mp3 đặt trong thư mục audio/
// ============================
var $ = function(id){ return document.getElementById(id); };
function fmt(x){ if(!isFinite(x)) return "0:00"; var m=Math.floor(x/60), r=Math.floor(x%60); return m+":"+(r<10?"0":"")+r; }
var a = new Audio(SRC), play = $("play");
a.preload = "metadata";
a.addEventListener("error", function(){ play.disabled = true; $("hint").textContent = "Chưa có file ghi âm ✨"; });
a.addEventListener("loadedmetadata", function(){ $("dur").textContent = fmt(a.duration); });
a.addEventListener("timeupdate", function(){ $("fill").style.width = (a.duration ? a.currentTime/a.duration*100 : 0) + "%"; $("cur").textContent = fmt(a.currentTime); });
a.addEventListener("ended", function(){ play.textContent="▶"; play.classList.remove("on"); $("hint").textContent="Yêu em nhiều 💗"; });
play.addEventListener("click", function(){
  if(a.paused){ a.play(); play.textContent="❚❚"; play.classList.add("on"); $("hint").textContent="Đang phát…"; }
  else { a.pause(); play.textContent="▶"; play.classList.remove("on"); $("hint").textContent="Đã tạm dừng"; }
});
$("bar").addEventListener("click", function(e){ var r=this.getBoundingClientRect(); if(a.duration) a.currentTime=(e.clientX-r.left)/r.width*a.duration; });
</script>
</body>
</html>
